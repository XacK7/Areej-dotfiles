[main]
font=JetBrains Mono:size=13
pad=14x10 center

[cursor]
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[colors-dark]
# dark purple background, off-white foreground
alpha=0.85
background=1e1b2e
foreground=f8f8f2

# Normal colors
regular0=1e1b2e
regular1=e91e8c
regular2=a8d8a8
regular3=f1fa8c
regular4=80cfa9
regular5=f48fb1
regular6=8be9fd
regular7=f8f8f2

# Bright colors
bright0=44475a
bright1=ff5555
bright2=b8f0c8
bright3=ffffa5
bright4=a4d8ff
bright5=ffb3d1
bright6=a4ffff
bright7=ffffff

selection-background=f48fb1
selection-foreground=1e1b2e

cursor=1e1b2e f48fb1

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+equal
font-decrease=Control+minus
font-reset=Control+0
